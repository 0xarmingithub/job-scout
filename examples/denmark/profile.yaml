# "Denmark" and "Danish" appear in nearly every posting here, so they carry no
# signal and are dropped from the automatic keyword list.
pre_filter_stop_words:
  - denmark
  - danish
  - danmark

# The three regions outside the Capital Region. All are two or more hours from
# Copenhagen, so a daily commute is not realistic. Both region names and the
# major cities are listed, because boards write the location either way.
