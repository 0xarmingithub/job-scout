# profile.yaml — the Denmark example.
#
# The same fictional candidate as the default profile, moved to Copenhagen and
# given the two constraints that make Denmark interesting to search:
#
#   - Elementary Danish. Perhaps a third of Danish postings require fluent or
#     professional Danish, and no amount of skill overlap makes those work. The
#     scorer rejects them outright on `language_barrier`.
#   - Permanent residence, not citizenship. Public-sector and defence-adjacent
#     roles in Denmark ask for Danish or EU citizenship. That is a different
#     rejection from the language one and needs saying separately.
#
# If either of those describes you, this file is closer to a starting point than
# the default profile is.

candidate:
  name: Morgan Reyes

  current_role: >
    IoT Specialist at a Danish industrial manufacturer, since 2022. Owns the
    edge platform connecting about 400 devices across four production sites to
    Azure.

  years_experience: "8"

  seniority: >
    Senior / Lead / Architect level. Not junior, not mid-level, not an
    internship, not a graduate programme.

  location: Copenhagen, Denmark

  work_authorization: >
    Holds Danish permanent residence. Not a Danish or EU citizen. Can work
    anywhere in Denmark with no sponsorship, but cannot take roles that require
    Danish or EU citizenship, or a Danish security clearance — which rules out
    most public-sector and defence work.

  target_geography: >
    Greater Copenhagen and the Capital Region, on-site or hybrid. Remote is fine
    if the employer is Danish. Not relocating within Denmark.

  languages:
    English: Fluent
    Portuguese: Native
    Danish: >
      Elementary. Can read a job advert and follow a stand-up. Cannot run a
      workshop, write customer documentation, or work in a Danish-only team.
      Roles asking for fluent, professional or business-level Danish are out.

target_roles:
  - IoT / IIoT Specialist
  - Solution Architect
  - Cloud / Azure Engineer
  - Technical Lead
  - Platform Engineer
  - Digital Solutions Engineer
  - Solution Engineer (vendor-side, technical pre-sales)
  - DevOps / Site Reliability Engineer
  - Systems / Integration Architect

core_skills:
  - Azure IoT Hub and IoT Edge
  - Azure IoT Operations (Arc and AKS based edge broker)
  - AKS / Kubernetes
  - Azure Container Apps in production
  - Docker and container image management
  - Python — automation, backend services, scripting
  - PowerShell — Windows and Azure scripting, deployment pipelines
  - Over-the-air update orchestration for edge device fleets
  - Patch and OS update rollout across distributed device fleets
  - MQTT, OPC-UA and Modbus
  - Azure API Management — OAuth2, rate limiting, managed identities
  - CI/CD pipelines in Azure DevOps
  - Bicep infrastructure as code
  - Azure Data Explorer for time-series telemetry
  - Azure Monitor, Log Analytics and Grafana
  - Azure Key Vault and secrets management
  - OT/IT integration architecture
  - Event-driven integration patterns
  - Domain-driven design in production

secondary_skills:
  - Terraform
  - AVEVA PI / OSIsoft historian integration
  - Seeq process intelligence
  - ERP integration (SAP, Oracle) via API and database
  - MES and factory system integration over REST
  - Digital twin platform architecture
  - Azure Logic Apps and Power Automate
  - .NET / C# for API Management policies and backend components
  - Raspberry Pi and edge hardware
  - Threat modelling and API security
  - Cloud cost modelling and FinOps
  - Azure landing zone design and governance
  - Linux hardening
  - Hyper-V virtualisation
  - Regulated-environment delivery and architecture traceability
  - Vendor evaluation and build-versus-buy decisions

confirmed_gaps:
  - "Building production agentic LLM systems — tool orchestration, guardrails, agent frameworks."
  - "Vector databases and vector search — Pinecone, Weaviate, pgvector, Azure AI Search."
  - "RAG, retrieval pipelines and embeddings."
  - "MLOps and LLMOps — Azure ML, MLflow, model serving, feature stores."
  - "PostgreSQL, MongoDB and Databricks in production."
  - "Security operations — SIEM, SOC, detection engineering, XDR, SOAR, incident forensics."
  - "Data engineering and data science ownership — owning pipelines or building models."
  - "GitOps tooling — ArgoCD, Flux, Helm."
  - "GitHub Actions."
  - "Laboratory data systems — LIMS, ELN, CDS, SDMS."
  - "GxP and computer system validation — CSV, CSA, pharma audit trails."
  - "Embedded firmware — C and C++ on bare metal or RTOS, drivers, hardware debugging."

industries_preferred:
