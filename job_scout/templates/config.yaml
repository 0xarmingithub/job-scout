# config.yaml. How the scout searches, and what it does with the results.
#
# This file holds nothing secret. Every API key and token lives in .env.
# Who you are and what counts as a match lives in profile.yaml.
#
# The values below are a working example built around a fictional candidate
# (see profile.yaml). Run it as-is to see the thing work, then change the
# searches to your own.

# ─── Threshold ────────────────────────────────────────────────────────────────
# The lowest score, out of 100, that gets you told about a job. Everything below
# it is still recorded, so it never comes back tomorrow.
#
# Start at 65. If you are getting more than about five a day, raise it. If you
# are getting none for a week, lower it, and check `job-scout run --dry-run`
# to see what scores the near-misses actually got.
notify_threshold: 65

# ─── Which model scores the jobs ──────────────────────────────────────────────
# There is no default. `job-scout init` asks you: a hosted API, or a coding
# assistant (CLI) already installed on your machine. Or set it here yourself.
#
# Two model choices decide a run, and they are separate (a third, cv_model, is
# used only by `job-scout cv import`, further down):
#   1. scoring_model (below). Runs on every posting that passes the keyword
#      filter, so its cost grows with how many postings you search.
#   2. tailor.command (optional). Runs only on the day's best match, to draft a
#      CV. Add it with `job-scout init <dir> --with-tailoring`.
#
# Format is "backend:model". All five backends are optional; you install what
# the one you pick needs and nothing else. Run `job-scout check` to see the
# state of all of them. Examples of what each looks like:
#
#   gemini:gemini-3.7-flash        Google API. Free tier covers a daily run
#                                  comfortably. Needs GOOGLE_API_KEY.
#   gemini:gemini-3.5-flash-lite   Cheaper and weaker.
#   openrouter:google/gemini-3.7-flash
#                                  Same models through OpenRouter, pay per token.
#   claude:sonnet                  Claude Code CLI, on your subscription.
#   grok:grok-4                    Grok CLI.
#   codex:gpt-5                    Codex CLI.
#
# Model names change. If a run fails saying the model was not found, check
# https://ai.google.dev/gemini-api/docs/models and put a current one here.
scoring_model: ""

# Retry a failed model call this many times before giving up on that posting.
scoring_retries: 1

# Seconds to wait between model calls. Raise this if you hit a rate limit.
scoring_delay_seconds: 0

# The free keyword pre-filter before the model sees anything. Leave it on: it is
# what keeps the bill flat. Turn it off only to find out what it was throwing
# away.
pre_filter: true

# Reject postings the model judges to be above your level as well as below it.
reject_too_senior: false

# ─── Which model reads your CV ────────────────────────────────────────────────
# Used only by `job-scout cv import`, which drafts resume.yaml from a CV you
# already have. A third model choice, separate from scoring_model, because a CV
# holds your name, contact details and whole employment history, and import
# sends it to this model in full. It always asks before it sends.
#
# There is no default. Leave this commented out and `job-scout cv import` asks
# the first time ("Use the same model as scoring? (Y/n)"), then writes the answer
# here. Same "backend:model" format as scoring_model. A search run never uses it.
#
# cv_model: "claude:sonnet"

# ─── Where results go ─────────────────────────────────────────────────────────
# You need at least one. `file` needs no credentials and is the right one to
# start with. Look at the output before you go and register a bot.
notifiers:
  - type: file
    path: matches.md        # relative to your data directory
    format: markdown        # markdown | text | csv | json
    append: true

  # A message per job on your phone. Needs TELEGRAM_BOT_TOKEN and
  # TELEGRAM_CHAT_ID in .env. See docs/setup-local.md.
  # - type: telegram

  # One email per run. Needs SMTP_HOST, SMTP_USER and SMTP_PASSWORD in .env.
  # - type: email
  #   to: you@example.com

  # Slack, Discord, or anything that takes a JSON body. Needs WEBHOOK_URL.
  # - type: webhook
  #   flavor: slack         # slack | discord | raw

# ─── Application outcomes (optional) ──────────────────────────────────────────
# If you keep a CSV of what happened to your applications, the scorer is told
# about it and can weigh a new posting against what actually converted for you.
# Absent by default, and everything works without it. Format:
#
#   title,company,status
#   Platform Engineer,Northwind Energy,rejected
#
# outcomes_file: outcomes.csv

# Rather than keep that CSV by hand, keep one folder per application and let the
# scout build the file. Each folder has a notes.md with a "**Status:**" line;
# `job-scout outcomes` turns them into outcomes.csv, and `job-scout run` does it
# again before it scores. The folder layout and the status words are in
# docs/applications.md. Relative to this directory, or absolute.
#
# With this set, the generated file is written to your data directory (a run
# never writes into the config directory), and outcomes_file above is for a file
# you keep by hand, so leave it unset.
# applications_dir: applications

# Text to remove from a Status line before it is read. Use it when a phrase of
# your own contains a status word but means something else, such as a step of
# your process that includes the word "interview". Case is ignored.
# status_ignore_phrases:
#   - "interview prep"

# Pull this directory before each run, when it is a git repository. A profile
# you push from your laptop is then live the next morning. The pull is retried
# after a wait. You are alerted only if it still fails and git already knows the
# remote has commits you lack. "Already knows" matters: that is the remote as git
# last saw it, and if the network is down the check cannot see newer commits, so
# a failed pull on a dead network may not alert. A --dry-run never pulls.
# sync:
#   git_pull: true
#   retries: 2
#   retry_wait_seconds: 10

# ─── Which board wins a tie ───────────────────────────────────────────────────
# When the same advert turns up on several boards, the copy from the board
# earliest in this list is kept. Anything not listed sorts last.
# source_priority: [linkedin, indeed, careerjet, apify, jobindex]

# ─── Searches ─────────────────────────────────────────────────────────────────
# Each entry is one query, run against every board in its `sites` list.
#
#   term            what to search for
#   sites           linkedin | indeed | glassdoor | zip_recruiter | google
#                   | careerjet | apify | jobindex
#   location        free text, passed to the board
#   country_indeed  Indeed needs the country named, e.g. "Germany", "USA"
#   hours_old       ignore anything older than this (LinkedIn and Indeed only)
#   results_wanted  cap per board per term
#
# Before you turn LinkedIn and Indeed on: both prohibit automated scraping in
# their terms of service. They are on by default because they are what actually
# produces results, but using them is your call. The lower-risk options are
# careerjet (a licensed partner API) and apify (a paid platform that does the
# collection under its own terms). See the disclaimer in README.md.
searches:
  - term: "platform engineer"
    sites: [linkedin, indeed]
    location: "Berlin, Germany"
    country_indeed: "Germany"
    hours_old: 96
    results_wanted: 50

  - term: "site reliability engineer"
    sites: [linkedin, indeed]
    location: "Berlin, Germany"
    country_indeed: "Germany"
    hours_old: 96
    results_wanted: 50

  - term: "kubernetes infrastructure engineer"
    sites: [linkedin, indeed]
    location: "Berlin, Germany"
    country_indeed: "Germany"
    hours_old: 96
    results_wanted: 50

  - term: "cloud solution architect"
    sites: [linkedin, indeed]
    location: "Berlin, Germany"
    country_indeed: "Germany"
    hours_old: 96
    results_wanted: 50

# ─── Careerjet (optional) ─────────────────────────────────────────────────────
# A licensed aggregator API. Needs CAREERJET_API_KEY, CAREERJET_REFERER and
# CAREERJET_USER_IP in .env. Careerjet rejects calls whose referring site and
# IP do not match what you registered. Add `careerjet` to a search's sites to
# use it.
# careerjet:
#   locale_code: en_GB       # en_US, de_DE, da_DK, fr_FR ...

# ─── Apify (optional, paid) ───────────────────────────────────────────────────
# Apify runs the scraping on its own machines with its own proxies, which is the
# fix for LinkedIn and Indeed throttling datacenter IPs, the reason the GitHub
# Actions path returns thin results. Needs APIFY_API_TOKEN in .env, and at least
# one Actor described here. There is no default Actor because every one of them
# bills differently.
#
# Prices below were checked on 2026-08-23. Check the Actor's own page before you
# point this at hundreds of postings a day.
# apify:
#   run_timeout_seconds: 300
#   actors:
#     - id: misceres/indeed-scraper      # $3.00 per 1,000 job listings
#       site: indeed
#       input:
#         position: "{term}"
#         location: "{location}"
#         country: "{country}"
#         maxItemsPerSearch: "{results_wanted}"
#
#     - id: bebity/linkedin-jobs-scraper # $29.99/month plus platform usage
#       site: linkedin
#       input:
#         title: "{term}"
#         location: "{location}"
#         rows: "{results_wanted}"

# ─── JobIndex (optional, Denmark only) ────────────────────────────────────────
# The largest Danish job board, and the one place a lot of Danish postings
# appear at all. Needs Playwright and a headless Chromium:
#   pip install playwright beautifulsoup4 lxml
#   playwright install chromium --with-deps
# Then add `jobindex` to a search's sites. See examples/denmark/.

# ─── Advanced (optional) ──────────────────────────────────────────────────────
# Nothing here needs changing to get started. The values shown are the defaults,
# so deleting a line puts it back.
#
# advanced:
#   # How much of a posting the model reads. The single biggest lever on cost:
#   # halve it and you roughly halve the token bill, at the price of the model
#   # sometimes missing a requirement buried near the end.
#   description_chars: 6000
#
#   # Room for the model's reply. Too small and a wordy answer gets cut off
#   # mid-sentence, which shows up as scoring errors.
#   reply_tokens: 1024
#
#   # How many past outcomes from outcomes.csv go into the prompt. Past this it
#   # grows without telling the model anything new.
#   outcomes_listed: 25
#
#   # How far back the title-and-company duplicate check looks. Longer catches
#   # more reposts under fresh URLs. Shorter lets a genuinely re-opened role
#   # through sooner. The URL check is exact and always runs regardless.
#   seen_lookback_days: 7
#
#   # How many runs a posting that failed to score (a timeout, a reply with no
#   # JSON) is tried again on before it is given up on. 0 gives up at once.
#   scoring_error_retries: 3
#
#   # Seconds between paged requests to a board. Raise it to be gentler. The
#   # JobIndex scraper never goes below 1 second whatever you put here.
#   source_delay_seconds: 0.5
#
#   # What the labels in a notification mean. Separate from notify_threshold,
#   # which decides whether you hear about a posting at all.
#   score_bands:
#     strong: 80
#     possible: 65
