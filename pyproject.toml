[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scout"
version = "1.2.1"
description = "A job-hunting agent that searches job boards daily, scores every posting against a profile you write, and sends you the good ones."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xarmingithub" }]
requires-python = ">=3.10"
keywords = ["jobs", "job-search", "scraping", "llm", "automation", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

# The core needs almost nothing. Everything that costs money, needs a browser,
# or belongs to one backend is an extra.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# The default job sources: LinkedIn, Indeed, Glassdoor, ZipRecruiter, Google.
jobspy = ["python-jobspy>=1.1.80", "pandas>=2.0"]
# The default scoring backend.
gemini = ["google-genai>=1.0"]
# jobindex.dk. Denmark only, and needs a headless browser:
#   playwright install chromium --with-deps
jobindex = ["playwright>=1.40", "beautifulsoup4>=4.12", "lxml>=5.0"]
# Reading a CV with `job-scout init --from-cv`. .txt and .md need neither.
cv = ["pypdf>=4.0", "python-docx>=1.1"]
# Everything above.
all = [
    "python-jobspy>=1.1.80",
    "pandas>=2.0",
    "google-genai>=1.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
job-scout = "job_scout.cli:main"

[project.urls]
Homepage = "https://github.com/0xarmingithub/job-scout"
Issues = "https://github.com/0xarmingithub/job-scout/issues"

[tool.setuptools.packages.find]
include = ["job_scout*"]

[tool.setuptools.package-data]
job_scout = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
