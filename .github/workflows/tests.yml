name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor. tests/test_compat.py parses every source file with
        # the 3.10 grammar, so this matrix and that test have to agree.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests
        # The suite reaches no network and reads no API keys, so this is the
        # same run a contributor gets on their laptop.
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check job_scout tests tools

  private-content:
    # This repository is public and most people working on it also have a
    # private workspace. One careless `git add` is all it takes, so the check
    # runs on every push and every pull request as well as in the local hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/pre_push_check.py

  version-bump:
    # Releases are cut automatically (.github/workflows/release.yml), but only
    # when the version moves. A change to job_scout/ that leaves the version
    # alone reaches nobody: everyone installs from a git URL, and
    # `pip install --upgrade` compares version strings, finds them equal, and
    # keeps the old code while printing a success line. That is exactly how the
    # fix in 1573703 failed to reach the machine it was found on.
    #
    # This runs on pushes too, not only pull requests, because work here mostly
    # lands on main directly and a pull-request-only gate would never fire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs the commit being compared against.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The version has to move when what ships moves
        env:
          # On a pull request, compare against the branch being merged into. On
          # a push, compare against what main was before the push.
          REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare against. Skipping."
            exit 0
          fi
          python tools/version_check.py --against "$REF"
